astar_planner_demo:
  ros__parameters:
    width: 140
    height: 90
    resolution: 0.1
    origin_x: 0.0
    origin_y: 0.0
    inflate_radius: 0.18
    start_x: 0.8
    start_y: 0.8
    goal_x: 12.8
    goal_y: 8.0
    timer_period: 0.2
    random_seed: 8
    random_obstacle_count: 120
    block_min_w: 2
    block_max_w: 10
    block_min_h: 2
    block_max_h: 8
    route_corridor_cells: 4
    dynamic_obstacle_radius: 0.30
    dynamic_obstacles: "4.6,1.6,0.20,0.00,3.5,6.0,1.6,1.6;6.5,4.3,0.00,0.18,6.5,6.5,3.0,5.6;9.2,6.7,-0.16,0.00,8.0,10.5,6.7,6.7;10.7,7.5,0.00,-0.14,10.7,10.7,6.0,8.2"

fake_base:
  ros__parameters:
    initial_x: 0.8
    initial_y: 0.8
    initial_yaw: 0.0
    update_period: 0.05
    cmd_timeout: 0.5

local_trajectory_planner:
  ros__parameters:
    update_period: 0.1
    horizon_distance: 3.0
    sample_step: 0.15
    obstacle_influence: 0.9
    max_obstacle_shift: 0.35
    smooth_iterations: 3

pure_pursuit:
  ros__parameters:
    update_period: 0.1
    lookahead: 0.7
    max_linear: 0.45
    max_angular: 1.2
    goal_tolerance: 0.25
    min_linear: 0.08
    use_sac_adaptation: true
    adaptation_timeout: 1.0
    min_speed_scale: 0.65
    max_speed_scale: 1.00
    min_lookahead_scale: 0.80
    max_lookahead_scale: 1.35
    min_lookahead: 0.45
    max_lookahead: 1.10
    angular_slowdown_gain: 0.35

safety_filter:
  ros__parameters:
    update_period: 0.05
    max_linear: 0.45
    max_angular: 1.2
    max_linear_accel: 0.60
    max_angular_accel: 2.0
    cmd_timeout: 1.5
    front_angle_deg: 45.0
    stop_distance: 0.30
    slow_distance: 0.85

sac_adapter:
  ros__parameters:
    update_period: 0.2
    smoothing_alpha: 0.35
    obstacle_caution_distance: 0.6
    goal_slow_distance: 0.6
    min_speed_scale: 0.65
    max_speed_scale: 1.00
    min_lookahead_scale: 0.80
    max_lookahead_scale: 1.35
    min_obstacle_caution: 0.80
    max_obstacle_caution: 1.45
    min_local_horizon_scale: 0.85
    max_local_horizon_scale: 1.20

teb_path_sender:
  ros__parameters:
    action_name: "follow_path"
    controller_id: "FollowPath"
    goal_checker_id: "goal_checker"
    update_period: 0.2
    resend_period: 2.0
    feedback_timeout: 4.0
    goal_tolerance: 0.35
    periodic_replan: false
    goal_change_distance: 0.25
    min_path_poses: 2
    waypoint_spacing: 0.15
    progress_timeout: 8.0
    progress_epsilon: 0.10

experiment_recorder:
  ros__parameters:
    output_dir: "~/ugv_nav_ws/results"
    file_prefix: "ugv_metrics"
    flush_every: 10

scenario_runner:
  ros__parameters:
    goals: "12.0,1.0;1.0,8.0;12.8,8.0;0.8,0.8"
    loop: false
    timeout_sec: 120.0
    settle_sec: 2.0
    initial_delay_sec: 3.0
    publish_period_sec: 1.0
